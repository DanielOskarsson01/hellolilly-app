<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HelloLilly - UX-wireframes (rest of site) v1</title>
<style>
  :root{
    --ink:#3f3f46; --mut:#8a8a93; --line:#d6d3d1; --bg:#f6f5f3; --card:#ffffff;
    --real:#3f6f52; --demo:#8a6d1f; --konc:#3d5a80; --built:#a1a1aa;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;}
  .app{display:flex; min-height:100vh;}

  /* ---------- NAV ---------- */
  nav{width:250px; min-width:250px; border-right:1px solid var(--line); background:#fbfaf9; padding:14px 0 40px;}
  nav h1{font-size:13px; letter-spacing:.4px; padding:4px 16px 10px; border-bottom:1px solid var(--line);}
  nav h1 small{display:block; color:var(--mut); font-weight:400; font-size:11px; margin-top:2px;}
  .nav-grp{padding:10px 8px 2px;}
  .nav-grp>span{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--mut); padding:0 8px 4px;}
  .nav-item{display:flex; align-items:center; gap:6px; width:100%; text-align:left; border:0; background:none; font:inherit; color:var(--ink); padding:5px 8px; border-radius:6px; cursor:pointer;}
  .nav-item:hover{background:#efedeb;}
  .nav-item.on{background:#e7e4e1; font-weight:600;}
  .nav-item.dead{color:var(--built); cursor:default;}
  .nav-item.dead:hover{background:none;}
  .t{font-size:9px; font-weight:700; letter-spacing:.5px; padding:1px 5px; border-radius:4px; border:1px solid; margin-left:auto; white-space:nowrap;}
  .t1{color:var(--real); border-color:var(--real);}
  .t2{color:var(--real); border-color:var(--real); border-style:dashed;}
  .t3{color:var(--real); border-color:var(--real); border-style:dotted;}
  .t4{color:var(--demo); border-color:var(--demo);}
  .t5{color:var(--konc); border-color:var(--konc);}
  .tb{color:var(--built); border-color:var(--built);}

  /* ---------- STAGE ---------- */
  main{flex:1; padding:22px 26px 80px; max-width:1080px;}
  .screen-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px;}
  .screen-head h2{font-size:20px;}
  .screen-head .sv{color:var(--mut); font-size:14px;}
  .tierline{font-size:11px; color:var(--mut); margin-bottom:12px;}

  .banner{border:1px solid; border-radius:6px; padding:7px 12px; font-size:12px; font-weight:600; margin-bottom:14px; display:flex; gap:8px; align-items:center;}
  .banner.demo{color:var(--demo); border-color:var(--demo); background:#fdf9ef;}
  .banner.konc{color:var(--konc); border-color:var(--konc); background:#f2f6fa;}

  .frame{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .cols{display:flex; gap:16px; align-items:flex-start;}
  .colmain{flex:1; min-width:0;}
  .help{width:210px; min-width:210px; border:1px dashed var(--line); border-radius:8px; padding:10px;}
  .help h4{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); margin-bottom:8px;}
  .help .slot{border:1px dashed var(--line); border-radius:6px; padding:8px; margin-bottom:8px; font-size:11px; color:var(--mut);}
  .help .slot b{display:block; color:var(--ink); font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px;}
  .help p{font-size:10px; color:var(--mut);}

  /* wireframe primitives */
  .wf{border:1px dashed var(--line); border-radius:8px; padding:12px; margin-bottom:12px; position:relative;}
  .wf:last-child{margin-bottom:0;}
  .wf>label{position:absolute; top:-8px; left:10px; background:var(--card); padding:0 6px; font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut);}
  .ln{height:9px; background:#eceae7; border-radius:4px; margin:6px 0;}
  .ln.w40{width:40%;} .ln.w60{width:60%;} .ln.w80{width:80%;} .ln.w25{width:25%;}
  .btn{display:inline-block; border:1.5px solid var(--ink); border-radius:6px; padding:5px 12px; font-size:12px; font-weight:600; margin:4px 6px 0 0; background:#fff;}
  .btn.sec{border-color:var(--mut); color:var(--mut); font-weight:500;}
  .btn.dis{border-style:dashed; color:var(--built); border-color:var(--built);}
  .inp{border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; color:var(--mut); background:#fff; margin:4px 6px 4px 0; display:inline-block;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0;}
  .chip{border:1px solid var(--line); border-radius:20px; padding:2px 10px; font-size:11px; color:var(--ink); background:#fff;}
  .chip.on{border-color:var(--ink); font-weight:600;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .card{border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff;}
  .card h5{font-size:12px; margin-bottom:4px;}
  .card small{color:var(--mut); font-size:10px;}
  .imgph{border:1px solid var(--line); border-radius:6px; background:
    linear-gradient(to top right, transparent calc(50% - 1px), var(--line), transparent calc(50% + 1px)),
    linear-gradient(to bottom right, transparent calc(50% - 1px), var(--line), transparent calc(50% + 1px)), #fafaf9;
    display:flex; align-items:center; justify-content:center; color:var(--mut); font-size:11px; min-height:90px;}
  .kv{display:flex; gap:10px; flex-wrap:wrap;}
  .kv .stat{border:1px solid var(--line); border-radius:8px; padding:8px 14px; font-size:12px; background:#fff;}
  .kv .stat b{display:block; font-size:16px;}
  .steps{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .steps .st{border:1px solid var(--line); border-radius:6px; padding:4px 10px; font-size:11px; color:var(--mut);}
  .steps .st.on{border-color:var(--ink); color:var(--ink); font-weight:600;}
  .bub{max-width:70%; border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; margin:6px 0; background:#fff;}
  .bub.me{margin-left:auto; background:#f1efec;}
  .kan{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .kan .col{border:1px dashed var(--line); border-radius:8px; padding:8px; min-height:110px;}
  .kan .col>b{font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--mut); display:block; margin-bottom:6px;}
  .kan .kc{border:1px solid var(--line); border-radius:6px; background:#fff; padding:6px; font-size:11px; margin-bottom:6px;}
  .callout{display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--konc); color:var(--konc); font-size:10px; font-weight:700; margin-right:6px;}
  .note-real{border-left:3px solid var(--real); background:#f2f6f3; padding:8px 10px; font-size:12px; border-radius:0 6px 6px 0; margin-bottom:12px;}
  .sec-label{display:inline-block; font-size:9px; font-weight:700; letter-spacing:.5px; padding:1px 6px; border-radius:4px; border:1px solid; margin-bottom:6px;}
  .sec-label.demo{color:var(--demo); border-color:var(--demo);}
  .sec-label.konc{color:var(--konc); border-color:var(--konc);}

  /* flows + notes */
  .flows{margin-top:16px; font-size:11px; color:var(--mut);}
  .flows b{color:var(--ink);}
  .flowchip{display:inline-block; border:1px solid var(--line); border-radius:20px; padding:2px 10px; margin:3px 4px 0 0; font-size:11px; cursor:pointer; background:#fff;}
  .flowchip:hover{border-color:var(--ink);}
  .flowchip.ext{cursor:default; color:var(--mut); border-style:dashed;}
  .uxnotes{margin-top:14px; border-top:1px solid var(--line); padding-top:10px;}
  .uxnotes h4{font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); margin-bottom:6px;}
  .uxnotes li{font-size:12px; margin:0 0 5px 16px;}

  @media(max-width:860px){
    .app{flex-direction:column;}
    nav{width:100%; min-width:0; display:flex; overflow-x:auto; padding:8px;}
    nav h1{display:none;}
    .nav-grp{display:flex; gap:4px; padding:0 4px;}
    .nav-grp>span{display:none;}
    .nav-item{white-space:nowrap;}
    .cols{flex-direction:column;} .help{width:100%;}
    .kan{grid-template-columns:1fr 1fr;}
    .grid3{grid-template-columns:1fr;}
    .grid2{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
<nav id="nav">
  <h1>HelloLilly UX-wireframes<small>Rest of site · v1 · UX only, no UI</small></h1>
</nav>
<main id="stage"></main>
</div>

<script>
const T = {
 T1:'<span class="t t1">T1 REAL</span>', T2:'<span class="t t2">T2 THIN</span>',
 T3:'<span class="t t3">T3 SHORTCUT</span>', T4:'<span class="t t4">T4 DEMO</span>',
 T5:'<span class="t t5">T5 KONCEPT</span>', TB:'<span class="t tb">BYGGD</span>', TC:'<span class="t tb">PÅGÅR</span>'
};
const BD = '<div class="banner demo">⚠ Demo - exempeldata · Skärmen visar hur verktyget fungerar, inte riktig data</div>';
const BK = '<div class="banner konc">◻ Koncept - kommande · En bild av verktyget, inte en skärm. Inget här går att klicka.</div>';
const HELP = (slots)=>`<aside class="help"><h4>Hjälp just nu</h4>${slots.map(s=>`<div class="slot"><b>${s[0]}</b>${s[1]}</div>`).join('')}<p>Panelen fylls per situation. Blir verklig i takt med att fler verktyg skeppas (HelpfulNow).</p></aside>`;

const SCREENS = [

/* ================= HEM ================= */
{id:'hem', grp:'Nav & hem', title:'Hem (hubben)', sv:'H1', tier:'T1',
 body:`
 <div class="wf"><label>En sak just nu (från Framstegsstöd)</label>
   <div style="font-size:15px;font-weight:600;">Slutför matchanalysen för Head of Product, Kindred</div>
   <div class="ln w60"></div>
   <span class="btn">Fortsätt</span><span class="btn sec">Inte idag</span>
 </div>
 <div class="wf"><label>Ärliga siffror (bara riktiga)</label>
   <div class="kv"><div class="stat"><b>3</b>nya matchande jobb</div><div class="stat"><b>2</b>ansökningar väntar svar</div><div class="stat"><b>1</b>övning kvar denna vecka</div></div>
 </div>
 <div class="wf"><label>Tysta ingångar - grupperade per behov, inte per kategori</label>
   <div class="chips"><span class="chip">Sök &amp; matcha</span><span class="chip">Skapa material</span><span class="chip">Förbered dig</span><span class="chip">Ta kontakt</span><span class="chip">Ny riktning</span><span class="chip">Min coach</span></div>
   <div class="ln w80"></div><div class="ln w60"></div>
 </div>`,
 flows:[['framsteg','Framstegsstöd (nästa steg)'],['ext','Jobbsök (byggd)'],['arende','Ärendevy']],
 notes:['En enda stor handling, aldrig en instrumentpanel. Allt annat är tyst.',
 'Ingångar till T4/T5-verktyg bär sin etikett redan på kortet - navet lovar aldrig mer än sidan håller.',
 'Alla döda hjältknappar och tummar från demon dör här.']},

/* ================= A. EXECUTION ================= */
{id:'framsteg', grp:'A · Utförande', title:'Framstegsstöd', sv:'Progress Support · A1', tier:'T1',
 body:`
 <div class="cols"><div class="colmain">
 <div class="wf"><label>Nästa steg (max 1 per dag)</label>
   <div style="font-weight:600;">Skicka uppföljning till Bonnier News (dag 7)</div>
   <span class="btn">Gör nu</span><span class="btn sec">Flytta till imorgon</span>
 </div>
 <div class="wf"><label>Aktivitet - loggas automatiskt av verktygen</label>
   <div style="font-size:12px;">✓ Jobb godkänt: Head of Product, Kindred <small style="color:var(--mut)">· idag · <u>dölj</u></small></div>
   <div style="font-size:12px;">✓ CV genererat (v3, engelska) <small style="color:var(--mut)">· igår · <u>dölj</u></small></div>
   <div style="font-size:12px;">✓ Intervjuövning slutförd, 9 frågor <small style="color:var(--mut)">· må · <u>dölj</u></small></div>
   <div class="ln w60"></div>
 </div>
 <div class="wf"><label>Veckovy</label>
   <div class="chips"><span class="chip on">Denna vecka</span><span class="chip">Förra veckan</span><span class="chip">Under studier: 1 lätt marknadshandling/vecka</span></div>

 </div>
 </div>${HELP([['Ton','Stödjande, aldrig övervakande'],['Mall','Uppföljningsmeddelande dag 7']])}</div>`,
 flows:[['hem','Hem (nästa-steg-kortet)'],['arende','Ärendevy (samma logg)'],['ext','Omställning: veckokadensen läser härifrån']],
 notes:['Ingen streak, ingen skuld. Personen kan dölja varje loggad post.',
 'Regelbaserad nästa-steg-logik (äldsta ofärdiga tråden vinner), ingen ML.',
 'Detta är datan som framtida inlärningslager lever på - varje vecka utan loggning är förlorad data.']},

{id:'intervju', grp:'A · Utförande', title:'Intervjuträning', sv:'Interview Trainer · A2', tier:'T1',
 body:`
 <div class="cols"><div class="colmain">
 <div class="wf"><label>Uppstart</label>
   <span class="inp">Välj jobb: Head of Product, Kindred ▾</span>
   <span class="inp">Stil: Kompetensbaserad ▾</span>
   <span class="btn">Starta övning</span>
   <div style="font-size:11px;color:var(--mut);margin-top:6px;">Detta är övning. Inget bedöms eller delas utan dig.</div>
 </div>
 <div class="wf"><label>Samtal - en fråga i taget</label>
   <div class="bub">Berätta om ett tillfälle när du behövde prioritera bort en funktion nära lansering. Hur resonerade du?</div>

   <div class="bub">Följdfråga: Hur reagerade teamet, och vad hade du gjort annorlunda?</div>
   <span class="inp" style="width:60%;">Skriv ditt svar ...</span><span class="btn sec">🎙 Tala</span>
 </div>
 <div class="wf"><label>Efteråt: återkoppling (citerar dina egna svar)</label>
   <div class="grid3"><div class="card"><h5>Starka ögonblick</h5><div class="ln"></div></div><div class="card"><h5>Svaga ögonblick</h5><div class="ln"></div></div><div class="card"><h5>En sak att öva</h5><div class="ln"></div></div></div>
 </div>
 </div>${HELP([['Coach','Vanliga frågor för rollen'],['Video','Så läser rekryterare svar'],['Övning','Självförtroende före intervju']])}</div>`,
 flows:[['prep','Intervjuförberedelse (matar in verkliga krav)'],['framsteg','Framstegsstöd (loggas)'],['ext','Matchanalys (jobbet + gapen)']],
 notes:['En fråga synlig åt gången - språkapp-känslan, aldrig ett formulär.',
 'Sju stilar är EN prompt-parameter, inte sju funktioner.',
 'Talat läge via webbläsarens röst först (gratis, sv-SE). Ingen inspelnings-UI - den falska dör oersatt.',
 'Återkopplingen citerar personens faktiska svar, hittar aldrig på (ärlighetsgrinden).']},

{id:'bild', grp:'A · Utförande', title:'Bildstöd', sv:'Image Studio · A3', tier:'T3',
 body:`
 <div class="steps"><span class="st on">1 Ladda upp</span><span class="st">2 Förbättra</span><span class="st">3 Beskär &amp; exportera</span></div>
 <div class="wf"><label>Före / efter - obligatorisk jämförelse</label>
   <div class="grid2"><div class="imgph">Ditt foto (före)</div><div class="imgph">Förbättrat (efter)</div></div>
   <div class="chips" style="margin-top:8px;"><span class="chip">Förbättringsstyrka ▂▄▆ (tak före kusliga zonen)</span><span class="chip">Byt bakgrund</span></div>
   <span class="btn">Det är fortfarande jag - godkänn</span><span class="btn sec">Justera</span>
 </div>
 <div class="wf"><label>Mallar - rätt beskärning för ändamålet</label>
   <div class="grid3"><div class="imgph" style="min-height:60px;">LinkedIn</div><div class="imgph" style="min-height:60px;">CV</div><div class="imgph" style="min-height:60px;">Neutral</div></div>
   <div style="font-size:11px;color:var(--mut);margin-top:6px;">En lugn bakgrund och bra ljus betyder mer än kameran.</div>
 </div>`,
 flows:[['linkedin','LinkedIn-stöd (profilbilden)'],['ext','CV-byggaren (byggd)']],
 notes:['Etiken i UX: samma ansikte, bättre fotografi. Godkännandet mot före/efter är grinden.',
 'Ingen syntes, inga identitetsändringar - reglaget tar fysiskt stopp före den zonen.',
 'Tre steg, stort förhandsvisningsyta. Litet verktyg, stor demo-effekt.']},

/* ================= B. OPPORTUNITY ================= */
{id:'foretag', grp:'B · Möjligheter', title:'Företagslista', sv:'Company List · B1', tier:'T1',
 body:`
 <div class="wf"><label>Lägg till</label><span class="inp">Sök företag ...</span><span class="btn sec">+ Lägg till manuellt</span><span class="chip">eller: från vilken jobbrad som helst i Jobbsök</span></div>

   <div class="card"><h5>Kindred Group <span class="chip" style="float:right;">Intresserad</span></h5><small>Varför relevant: <span class="ln w40" style="display:inline-block;height:8px;"></span></small><div class="ln w40"></div><small>1 öppen roll · senast: research körd</small><div class="chips"><span class="chip">Undersök</span><span class="chip">Spontanansökan</span><span class="chip">Kontaktplan</span></div></div>
 </div></div>`,
 flows:[['spontan','Spontanansökningar'],['kontakt','Kontaktplan'],['research','Researchstöd (dossier på ett klick)'],['radar','Jobbradar (föreslår hit senare)']],
 notes:['Billigaste riktiga verktyget: ren CRUD + befintlig A1-researcher.',

 body:`
 <div class="cols"><div class="colmain">
 <div class="steps"><span class="st on">1 Research</span><span class="st">2 Vinkel</span><span class="st">3 Mottagare</span><span class="st">4 Meddelande</span><span class="st">5 Uppföljning</span></div>

{id:'radar', grp:'B · Möjligheter', title:'Jobbradar', sv:'Job Radar · B3', tier:'T2',
 body:`
 <div class="wf"><label>Veckans signaler - varje signal slutar i EN handling</label>

   <div class="card" style="margin-bottom:8px;"><h5>Bonnier News: 6 annonser denna månad (snitt: 2)</h5><small>Observerat i jobbdatan · Källa: Platsbanken</small><div><span class="btn sec">Lägg i Företagslista</span></div></div>
   <span class="sec-label" style="color:var(--real);border-color:var(--real);">VERKLIG · branschpress</span>

 </div>
 <div class="wf"><label>Kommande signaltyper</label>
   <span class="sec-label konc">KONCEPT - KOMMANDE</span>
   <div class="grid2">
     <div class="imgph" style="min-height:70px;"><span><span class="callout">1</span>Upphandlingar</span></div>
     <div class="imgph" style="min-height:70px;"><span><span class="callout">2</span>Investeringar</span></div>
     <div class="imgph" style="min-height:70px;"><span><span class="callout">3</span>Ledningsförändringar</span></div>

/* built / in-flight items shown in nav for orientation */
const BUILT = [
 {title:'Jobbsök', tag:'TB'},{title:'Matchanalys', tag:'TC'},{title:'CV-byggaren', tag:'TC'},
 {title:'Personligt brev', tag:'TC'},{title:'Ansökningskoll', tag:'TC'},{title:'Omställning (egen plan M0-M8)', tag:'TB'}
];

const GROUPS = ['Nav & hem','A · Utförande','B · Möjligheter','D · Förberedelse','E · Nätverk','F · Coach','G · Lärande','Community & leverans'];

const nav = document.getElementById('nav');
GROUPS.forEach(g=>{
  const d=document.createElement('div'); d.className='nav-grp';
  d.innerHTML=`<span>${g}</span>`+SCREENS.filter(s=>s.grp===g).map(s=>
    `<button class="nav-item" data-id="${s.id}">${s.title} ${T[s.tier]}</button>`).join('');
  nav.appendChild(d);
});
const df=document.createElement('div'); df.className='nav-grp';
df.innerHTML='<span>Redan planerat (frontieren)</span>'+BUILT.map(b=>`<div class="nav-item dead">${b.title} ${T[b.tag]}</div>`).join('');
nav.appendChild(df);

const stage=document.getElementById('stage');
function show(id){
  const s=SCREENS.find(x=>x.id===id)||SCREENS[0];
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('on', b.dataset.id===s.id));
  const tierNames={T1:'T1 REAL - fungerar på riktigt',T2:'T2 WIRED-THIN - verklig funktion, medvetet smal',T3:'T3 SHORTCUT - open source/genväg bakom vår UI',T4:'T4 LABELLED DEMO - attrapp med banner',T5:'T5 KONCEPT-PANEL - en bild, ingen skärm'};
  stage.innerHTML=`
   <div class="screen-head"><h2>${s.title}</h2><span class="sv">${s.sv}</span>${T[s.tier]}</div>
   <div class="tierline">${tierNames[s.tier]}</div>
   ${s.banner==='demo'?BD:s.banner==='konc'?BK:''}
   <div class="frame">${s.body}</div>
   <div class="flows"><b>Korslänkar:</b> ${s.flows.map(f=>f[0]==='ext'?`<span class="flowchip ext">${f[1]}</span>`:`<span class="flowchip" data-go="${f[0]}">→ ${f[1]}</span>`).join('')}</div>
   <div class="uxnotes"><h4>UX-beslut &amp; öppna frågor</h4><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;
  stage.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>show(c.dataset.go));
  window.scrollTo(0,0);
}
document.querySelectorAll('.nav-item[data-id]').forEach(b=>b.onclick=()=>show(b.dataset.id));
show('hem');
</script>
</body>
</html>
