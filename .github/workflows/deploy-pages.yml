name: Build GitHub Pages

on:
  push:
    branches: [main]
  # Run the same test+build gate on PRs so a broken build (or a red test) fails CI
  # BEFORE it can merge to main — not just after, on the post-push deploy. The publish
  # step below is guarded to main pushes only, so PRs run the gate without deploying.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Skeleton/submodule tests must pass before anything deploys. A red test here
      # fails the job, so the Build + Upload steps below never run. (server/ is not in
      # the Vite build, so this is the only thing that exercises the broker/gate/guard.)
      - name: Run tests
        run: npm test

      # The build is a required gate: a compile failure here fails the whole job
      # (node --test never runs Vite, so tests alone cannot catch a broken build).
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Deploy only from a push to main. On pull_request the steps above still run as
      # the pre-merge gate, but this publish step is skipped.
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
