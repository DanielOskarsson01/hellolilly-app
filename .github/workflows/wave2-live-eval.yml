name: Wave 2 live eval (zero-tolerance judges)

# The Tier-2 LIVE corpus (harness/wave2/run-eval-live.cjs): runs the trap corpus through the
# REAL judges + drafter (claude-opus-4-8, 3 runs each) and the Judge-A worded-addition classes
# + misattribution trials. It needs an ANTHROPIC_API_KEY (paid), so it is NOT on the per-push
# gate; it runs on manual dispatch and on a weekly schedule. The runner SKIPS cleanly (exit 0,
# skipped manifest) when the secret is absent, so a fork or an unconfigured repo never fails.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Wave 2 live zero-tolerance eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval:wave2:live
      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave2-eval-live-manifest
          path: harness/wave2/eval-live-manifest.json
          if-no-files-found: warn
